[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xsunshine"
version = "0.3.0"
description = "Terminal cleanup of empty Windows directories and registry keys"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
xsunshine = "xsunshine.cli:main"

[dependency-groups]
dev = ["ruff==0.17.2"]

[tool.setuptools.packages.find]
include = ["xsunshine*"]

[tool.ruff]
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
